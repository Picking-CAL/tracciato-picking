<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tracciato Picking</title>
<style>
:root{--paper:#F2F4F3;--panel:#FFFFFF;--line:#D5DBD9;--ink:#1B2427;--muted:#5D6A6E;--accent:#DC5E17;--bad:#BF3328}
@media (prefers-color-scheme: dark){:root{--paper:#131719;--panel:#1B2023;--line:#2D3539;--ink:#E5EBEC;--muted:#93A0A4;--accent:#F07A33;--bad:#E5584C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;display:flex;align-items:center;gap:10px;font:700 26px/1 "Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.01em}
h1 span{width:24px;height:19px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--ink) 5px 10px)}
p{margin:0;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
input{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <p>Accesso riservato. Inserisci la password per aprire lo strumento.</p>
  <label for="pw">Password<input type="password" id="pw" required autofocus></label>
  <button type="submit" id="go">Entra</button>
  <div class="err" id="err" role="alert"></div>
</form>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Questo browser non supporta la cifratura: apri il sito con Chrome, Edge o Firefox aggiornati.';return;}
  btn.disabled=true;btn.textContent='Verifica in corso…';err.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);

    document.open();document.write(html);document.close();
  }catch(x){
    btn.disabled=false;btn.textContent='Entra';err.textContent='Password non corretta.';
    const p=document.getElementById('pw');p.select();p.focus();
